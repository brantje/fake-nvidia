# Phase 8 full-stack harness for the published, unmodified LlamaCPP-Manager image.
#
# Prepare the fake runtime first, for example:
#   make runtime
#   go run ./cmd/fake-nvidia up \
#     --profile rtx4060ti-16gb --gpus 2 \
#     --runtime-dir "$PWD/.runtime" --root "$PWD/.phase8/fake-nvidia"
#
# Then export host-owned writable directories and start this file:
#   export FAKE_NVIDIA_ROOT="$PWD/.phase8/fake-nvidia"
#   export PHASE8_CONFIG_DIR="$PWD/.phase8/config"
#   export PHASE8_MODELS_DIR="$PWD/.phase8/models"
#   export PUID="$(id -u)" PGID="$(id -g)"
#   docker compose -f examples/llamacpp-manager/compose.phase8.yaml up
#
# The default image is pinned to the immutable LlamaCPP-Manager digest recorded
# for Phase 8. Override LLAMACPP_MANAGER_IMAGE explicitly when advancing that pin.
services:
  llamacpp-manager:
    image: ${LLAMACPP_MANAGER_IMAGE:-ghcr.io/brantje/llamacpp-manager@sha256:1cbd6bf1d31893cdcdf6126e1e4239d39f1a903e4837251d0cd528d7a7a70586}
    user: "${PUID:?set PUID}:${PGID:?set PGID}"
    ports:
      - "127.0.0.1:${PHASE8_PORT:-18888}:8000"
    environment:
      LCM_LISTEN_ADDR: ":8000"
      LCM_DATA_DIR: /config
      LCM_MODELS_DIR: /models
      LCM_LLAMA_SERVER: /opt/fake-nvidia/runtime/bin/fake-llama-server
      PATH: /opt/fake-nvidia/runtime/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/fake-nvidia/runtime/lib
      MOCK_NVML_CONFIG: /var/lib/fake-nvidia/config.yaml
      MOCK_NVML_OVERRIDES: /var/lib/fake-nvidia/overrides.yaml
    volumes:
      - ${PHASE8_CONFIG_DIR:?set PHASE8_CONFIG_DIR}:/config
      - ${PHASE8_MODELS_DIR:?set PHASE8_MODELS_DIR}:/models
      - ${FAKE_NVIDIA_ROOT:?set FAKE_NVIDIA_ROOT}/runtime:/opt/fake-nvidia/runtime:ro
      - ${FAKE_NVIDIA_ROOT:?set FAKE_NVIDIA_ROOT}/state:/var/lib/fake-nvidia
      - /proc:/host/proc:ro
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
