# Apply on top of brantje/llamacpp-manager/docker-compose.yml.
# Do not combine this test override with docker-compose.nvidia.yml: fake-nvidia
# deliberately requires no NVIDIA Container Toolkit or host GPU device mapping.
#
# This override injects NVIDIA discovery/telemetry only. For the complete Phase 8
# stack, including fake-llama-server, use compose.phase8.yaml instead.
services:
  llamacpp-manager:
    environment:
      LD_LIBRARY_PATH: /opt/fake-nvidia/lib
      MOCK_NVML_CONFIG: /var/lib/fake-nvidia/config.yaml
      MOCK_NVML_OVERRIDES: /var/lib/fake-nvidia/overrides.yaml
    volumes:
      - ${FAKE_NVIDIA_ROOT:?run fake-nvidia up first}/runtime/bin/nvidia-smi:/usr/local/bin/nvidia-smi:ro
      - ${FAKE_NVIDIA_ROOT:?run fake-nvidia up first}/runtime/bin/nvidia-smi.real:/usr/local/bin/nvidia-smi.real:ro
      - ${FAKE_NVIDIA_ROOT:?run fake-nvidia up first}/runtime/bin/nvml-mock-ctl:/usr/local/bin/nvml-mock-ctl:ro
      - ${FAKE_NVIDIA_ROOT:?run fake-nvidia up first}/runtime/lib:/opt/fake-nvidia/lib:ro
      - ${FAKE_NVIDIA_ROOT:?run fake-nvidia up first}/state:/var/lib/fake-nvidia
