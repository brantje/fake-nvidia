name: Phase 9

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: phase9-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.32.0
  KIND_SHA256_AMD64: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
  KIND_NODE_IMAGE: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
  FAKE_NVIDIA_KIND_CLUSTER: fake-nvidia
  FAKE_NVIDIA_K8S_IMAGE: fake-nvidia-k8s:phase9

jobs:
  kind:
    name: CPU-only Kind / CDI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned Kind
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" -o /tmp/kind
          echo "${KIND_SHA256_AMD64}  /tmp/kind" | sha256sum -c -
          chmod 0755 /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version
          kubectl version --client

      - name: Run Phase 9 non-cluster checks
        run: make phase9

      - name: Build Phase 9 node installer image
        run: make kubernetes-image K8S_IMAGE="$FAKE_NVIDIA_K8S_IMAGE"

      - name: Create CPU-only Kind cluster
        run: kind create cluster --name "$FAKE_NVIDIA_KIND_CLUSTER" --image "$KIND_NODE_IMAGE" --wait 120s

      - name: Load installer image into Kind
        run: kind load docker-image "$FAKE_NVIDIA_K8S_IMAGE" --name "$FAKE_NVIDIA_KIND_CLUSTER"

      - name: Run Phase 9 Kubernetes integration
        run: make kubernetes-integration K8S_IMAGE="$FAKE_NVIDIA_K8S_IMAGE" KIND_CLUSTER="$FAKE_NVIDIA_KIND_CLUSTER"

      - name: Export Kind logs on failure
        if: failure()
        run: kind export logs /tmp/fake-nvidia-kind-logs --name "$FAKE_NVIDIA_KIND_CLUSTER" || true

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name "$FAKE_NVIDIA_KIND_CLUSTER" || true
