name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Formatting
        run: |
          files="$(gofmt -l .)"
          test -z "$files" || { printf 'gofmt required for:\n%s\n' "$files" >&2; exit 1; }

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build every Go command
        run: make build-all

      - name: Validate release and profile contract
        run: make profile-contract

  compatibility:
    name: Native and Docker compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify Docker buildx
        run: docker buildx version

      - name: Build pinned Mock NVML/CUDA runtime
        run: make runtime

      - name: Control and CLI compatibility smoke
        run: FAKE_NVIDIA_RUNTIME_DIR="$PWD/.runtime" go test -tags=integration -run '^TestPhase4' -v ./tests/compatibility

      - name: CUDA shim supported-surface smoke
        run: FAKE_NVIDIA_RUNTIME_DIR="$PWD/.runtime" go test -tags=integration -run '^TestPhase6' -v ./tests/compatibility

      - name: Fake llama-server compatibility smoke
        run: FAKE_NVIDIA_RUNTIME_DIR="$PWD/.runtime" go test -tags=integration -run '^TestPhase7' -v ./tests/compatibility

      - name: Full nvidia-smi and native compatibility suite
        run: |
          test -x .runtime/bin/nvidia-smi
          test -x .runtime/bin/fake-llama-server
          test -f .runtime/lib/libcuda.so.1
          test -f .runtime/lib/libcudart.so
          FAKE_NVIDIA_RUNTIME_DIR="$PWD/.runtime" go test -tags=integration -v ./tests/compatibility

      - name: CPU-only Docker image and injection suite
        run: FAKE_NVIDIA_RUNTIME_DIR="$PWD/.runtime" go test -tags=docker_integration -v ./tests/docker
