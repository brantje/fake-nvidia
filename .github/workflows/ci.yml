name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  compatibility:
    name: Mock NVML compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify Docker buildx
        run: docker buildx version

      - name: Resolve NVIDIA package checksums
        run: |
          for repo_arch in x86_64 sbsa; do
            echo "--- ${repo_arch} ---"
            curl -fsSL "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/${repo_arch}/Packages.gz" |
              gzip -dc |
              awk '
                BEGIN { RS=""; FS="\n" }
                /^Package: nvidia-utils-580$/ && $0 ~ /^Version: 580\.65\.06-0ubuntu1$/m {
                  for (i = 1; i <= NF; i++) {
                    if ($i ~ /^(Filename|SHA256): /) print $i
                  }
                }'
          done

      - name: Build pinned Mock NVML runtime
        run: make runtime

      - name: Run native compatibility tests
        run: make compatibility
