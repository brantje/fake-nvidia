apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
  labels:
    app.kubernetes.io/name: nvidia-device-plugin
    app.kubernetes.io/part-of: fake-nvidia-phase9
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin
      app.kubernetes.io/part-of: fake-nvidia-phase9
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin
        app.kubernetes.io/part-of: fake-nvidia-phase9
    spec:
      nodeSelector:
        fake-nvidia.com/enabled: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.20.0
          imagePullPolicy: IfNotPresent
          args:
            - --fail-on-init-error=true
            - --device-discovery-strategy=nvml
            - --nvidia-driver-root=/var/lib/fake-nvidia
            - --nvidia-dev-root=/var/lib/fake-nvidia
            - --pass-device-specs=true
            - --device-id-strategy=index
          env:
            - name: LD_LIBRARY_PATH
              value: /var/lib/fake-nvidia/runtime/lib
            - name: MOCK_NVML_CONFIG
              value: /var/lib/fake-nvidia/state/config.yaml
            - name: MOCK_NVML_OVERRIDES
              value: /var/lib/fake-nvidia/state/overrides.yaml
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: fake-nvidia
              mountPath: /var/lib/fake-nvidia
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: fake-nvidia
          hostPath:
            path: /var/lib/fake-nvidia
            type: Directory
